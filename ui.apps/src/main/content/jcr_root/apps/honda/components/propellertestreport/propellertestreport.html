    <div class="honda-propeller-test-report"

        <div class="cmp-search-claims" id="pp-test" data-cmp-is="propeller">
            
			<div class="cmp-search-claims__header">

			</div>
			<div class="section-header">
				<h2 class="section-title">Search Reports</h2>
			</div>
                         
			<form class="cmp-search-claims__form" id="search-form">
				<div class="cmp-search-claims__form-row">  
                    <div class="cmp-search-claims__form-group">
                        <label class="cmp-search-claims__form-label">Hull Material</label>
                        <select class="form-select" id="hull-material">
                            <option value="">&lt;&lt; SELECT &gt;&gt;</option>
                            <sly data-sly-list.material="${model.hullMaterials}">
                                <option value="${material}">${material}</option>
                            </sly>
                        </select>
                    </div>
                    <div class="cmp-search-claims__form-group">
                        <label class="cmp-search-claims__form-label">HP</label>
                        <select class="form-select" id="hp">
                            <option value="">&lt;&lt; SELECT &gt;&gt;</option>
                            <sly data-sly-list.power="${model.horsepowers}">
                                <option value="${power}">${power}</option>
                            </sly>
                        </select>
                    </div>
                    <div class="cmp-search-claims__form-group">
                        <label class="cmp-search-claims__form-label">Boat Type</label>
                        <select class="form-select" id="boat-type">
                            <option value="">&lt;&lt; SELECT &gt;&gt;</option>
                            <sly data-sly-list.type="${model.boatTypes}">
                                <option value="${type}">${type}</option>
                            </sly>
                        </select>
                    </div>
                    <div class="cmp-search-claims__form-group">
                        <button type="submit" class="btn btn-primary" style="height: 46px; width: 190px; margin-top: 25px;">Search</button>
                    </div>
                    
				</div>
			</form>
